name: Build hEX OpenWrt 48MHz

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone OpenWrt v25.12.6
        run: git clone --depth 1 --branch v25.12.6 https://github.com/openwrt/openwrt.git

      - name: Patch MMC clock 50 -> 48 MHz
        working-directory: openwrt
        run: |
          F=target/linux/ramips/dts/mt7621.dtsi
          echo "--- before"; grep -nE '^\s*max-frequency' $F
          sed -i -E 's/^(\s*max-frequency = <)50000000(>;)/\148000000\2/' $F
          echo "--- after"; grep -nE '^\s*max-frequency' $F
          test "$(grep -cE '^\s*max-frequency = <48000000>;' $F)" = "1"

      - name: Configure
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_mikrotik_routerboard-750gr3=y
          CONFIG_PACKAGE_kmod-mmc=y
          CONFIG_PACKAGE_kmod-sdhci=y
          CONFIG_PACKAGE_kmod-sdhci-mt7620=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_blkid=y
          EOF
          make defconfig
          grep -E 'DEVICE_mikrotik_routerboard-750gr3|sdhci-mt7620' .config

      - name: Download sources
        working-directory: openwrt
        run: make download -j8

      - name: Build
        working-directory: openwrt
        run: make -j$(nproc) || make -j1 V=s

      - name: Check DTB result
        working-directory: openwrt
        run: ls -la bin/targets/ramips/mt7621/ | grep -i 750gr3

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: hex-48mhz
          path: |
            openwrt/bin/targets/ramips/mt7621/*750gr3*
            openwrt/bin/targets/ramips/mt7621/sha256sums
            openwrt/.config
